<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#02050B" />
    <meta name="description" content="Private YouTube, no recommendations." />
    <meta property="og:title" content="GoTube" />
    <meta property="og:description" content="Private YouTube, no recommendations." />
    <meta property="og:image" content="/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>GoTube</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #02050b;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      .splashBrand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: min(320px, 76vw);
      }

      .splashLogo {
        width: 100%;
        aspect-ratio: 720 / 456;
        object-fit: cover;
      }

      .goTubePulse {
        animation: goTubeHeartbeat 1s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes goTubeHeartbeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }

      #boot-splash.bootSplashHidden {
        opacity: 0;
        visibility: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        .goTubePulse { animation: none; }
        #boot-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading GoTube">
      <div class="splashBrand">
        <img class="splashLogo goTubePulse" src="/brand/gotube-mark-blue-transparent.svg" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
